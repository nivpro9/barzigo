body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:50px;height:46px;border-radius:10px;background:#ffffff;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.word{font-family:"Rubik",var(--body);font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:-.01em;color:var(--brandInk)}
.word em{font-style:normal;color:var(--go2);background:linear-gradient(90deg,var(--go1),var(--go2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-size:.8rem;color:var(--muted);display:block;margin-top:2px}
.ctrls{display:flex;gap:8px;align-items:center}
.ctrls select,.iconbtn{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.demo{font-size:.82rem;color:var(--warn);background:var(--warnSoft);border-radius:8px;padding:8px 12px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.mapcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .mapcol{position:static}
  .grid.v-route .mapcol,.grid.v-steps .mapcol{order:-1}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
.here{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.here .name{font-size:1.15rem;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accentInk)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.soft{background:var(--accentSoft);color:var(--ink)}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:6px 12px;font-size:.85rem}
.search{position:relative}
.search input{width:100%;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding-inline:46px 14px;font-size:1.05rem}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.soon{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.88rem}
.soon b{display:block}
.soon span{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;flex:none;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:122px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .ti{width:44px;height:44px;border-radius:12px;background:var(--c);color:var(--badgeInk);display:grid;place-items:center}
.tile b{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;margin-top:auto}
.btn.big{min-height:58px;font-size:1.1rem}

.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}

.empty{color:var(--muted);padding:8px 2px}

.muted{color:var(--muted)}

.sum{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:.88rem;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line);text-align:start;background:none;border-inline:0;border-top:0;width:100%}
li:last-child .step{border-bottom:0}
.step[aria-current="true"]{background:var(--accentSoft);border-radius:10px}
.ic{width:36px;height:36px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.ic.arrive{background:var(--accent);color:var(--accentInk)}
.ic.start{background:var(--route);color:var(--routeCase)}
.step .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.note{font-size:.82rem;color:var(--muted)}
.step .d{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.big{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.big .ic{width:64px;height:64px;border-radius:16px}
.big .ic svg{width:38px;height:38px}
.big .say{font-size:1.4rem;font-weight:500;line-height:1.35;text-wrap:balance}
.photo{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.85rem;width:100%}
.navbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.done{align-items:center;text-align:center}
.done .ic{width:72px;height:72px;border-radius:50%}
.fb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.livebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mapttl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.map{width:100%;height:auto;display:block;border-radius:10px;max-width:100%}

.map .bl{cursor:pointer}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.flow{stroke-dasharray:18 18;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

const SB_URL="",SB_KEY="";
// names on the field form that differ from the department names above
const NAME_ALIAS={"מיון נשים, הריון בסיכון, מחלקת נשים":"מיון נשים ומחלקת נשים","חדרי ניתוח אשפוז יום":"ניתוחי אשפוז יום"};
function matchDept(b,name){name=NAME_ALIAS[name]||name;const base=n=>n.split(" (")[0].trim();
  return DEPTS.find(d=>d.b===b&&(d.n[0]===name||base(d.n[0])===base(name)))}
async function loadField(){
  if(!SB_URL||!SB_KEY)return;
  try{const r=await fetch(SB_URL+"/rest/v1/mapping?select=id,data",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)return;
    let changed=false;
    for(const {id,data:x} of await r.json()){if(!/^b\d+$/.test(id)||!x)continue;const b=id.slice(1),depts={};
      for(const i in x.depts||{}){const v=x.depts[i],d=v&&v.name&&matchDept(b,v.name);if(d&&(v.floor||v.howto))depts[d.n[0]]={floor:v.floor,howto:v.howto}}
      if(!x.entrance&&!Object.keys(depts).length&&!x.approach)continue;
      INDOOR[b]={entrance:x.entrance||"",entranceAccess:x.entranceAccess||"",approach:x.approach||"",approachNote:x.approachNote||"",elevators:x.elevators||"",elevNote:x.elevNote||"",depts};changed=true}
    if(changed){markApproach();if(S.view!=="live")render()}
  }catch(e){}
}

/* ---------- Routing ---------- */
// accessible mode avoids steps; when no step-free way exists, fall back to the regular route and flag it
function findRoute(from,to){
  const R=shortest(from,to,S.acc);if(R||!S.acc)return R;
  const F=shortest(from,to,false);if(F)F.noAcc=true;return F;
}
function shortest(from,to,acc){
  const dist={},prev={},pe={},Q=new Set(Object.keys(N));for(const k of Q)dist[k]=Infinity;dist[from]=0;
  while(Q.size){let u=null,b=Infinity;for(const k of Q)if(dist[k]<b){b=dist[k];u=k}if(u===null||u===to)break;Q.delete(u);
    if(N[u].bld&&u!==from)continue; // never walk through a building
    for(const {to:v,e} of ADJ[u]){if(acc&&e.stairs)continue;const w=dist[u]+e.d;if(w<dist[v]){dist[v]=w;prev[v]=u;pe[v]=e}}}
  if(dist[to]===Infinity)return null;
  const path=[to],edges=[];let c=to;while(c!==from){edges.unshift(pe[c]);c=prev[c];path.unshift(c)}
  const walk=edges.reduce((s,e)=>s+e.d,0);
  return {path,edges,walk:Math.round(walk/10)*10,mins:Math.max(1,Math.round(walk/1.2/60))};
}
function buildSteps(R,dept){
  const P=R.path.map(id=>N[id]),st=[];
  st.push({kind:"start",text:t("start",{a:nm(P[0])}),seg:[0,0],dist:0});
  let heading=null,cur=null;
  for(let i=0;i<R.edges.length;i++){
    const a=P[i],c=P[i+1],e=R.edges[i],v=[c.x-a.x,c.y-a.y];let kind;
    if(heading===null)kind="head";
    else{const cr=heading[0]*v[1]-heading[1]*v[0],dt=heading[0]*v[0]+heading[1]*v[1];const ang=Math.atan2(cr,dt)*180/Math.PI,ab=Math.abs(ang);
      kind=ab<25?"straight":ab<60?(ang>0?"slightRight":"slightLeft"):ab<150?(ang>0?"right":"left"):"uturn"}
    const sameName=cur&&cur.n&&nm(cur.n)===nm(c);
    if(cur&&cur.walk&&(kind==="straight"||sameName)&&!c.bld){cur.dist+=e.d;cur.seg[1]=i+1;cur.n=c;cur.text=t(cur.tpl,{b:nm(c)})}
    else{cur={walk:true,kind,tpl:kind,n:c,dist:e.d,seg:[i,i+1],text:t(kind,{b:nm(c)})};st.push(cur)}
    heading=v;
  }
  const L=P[P.length-1],ins=indoorSteps(dept),end=[P.length-1,P.length-1];
  if(ins){st.push({kind:"arrive",text:t("arrive",{b:nm(L)}),note:INDOOR[dept.b].sample?t("sample"):"",seg:end,dist:0});ins.forEach(s=>st.push(Object.assign(s,{seg:end,dist:0})))}
  else st.push({kind:"arrive",text:t("arrive",{b:nm(L)}),note:t("inside",{d:nm(dept)}),note2:t("insideSoon"),seg:end,dist:0});
  const cum=[0];R.edges.forEach((e,i)=>cum.push(cum[i]+e.d));R.cum=cum;R.total=cum[cum.length-1];
  st.forEach(s=>s.endM=cum[s.seg[1]]);
  return st;
}
// steps from the building entrance to the department, when the building has been mapped
function indoorSteps(dept){
  const x=INDOOR[dept.b];if(!x)return null;
  const di=(x.depts||{})[dept.n[0]]||{},tr=t("fieldHe"),st=[];
  const apr=x.approach==="stairs"?t("warnApproach")+(x.approachNote?" "+x.approachNote:""):"";
  st.push({kind:"enter",text:x.entrance?t("enter",{e:x.entrance}):t("enterPlain"),note:[{flat:t("accFlat"),ramp:t("accRamp"),stairs:t("warnStairs")}[x.entranceAccess],apr].filter(Boolean).join(" · "),note2:x.entrance||x.approachNote?tr:""});
  if(di.floor&&di.floor!=="0"){const noEl=x.elevators==="none";
    st.push({kind:"floor",text:t(noEl?"floorStairs":S.acc?"floorElev":"floorAny",{f:di.floor}),note:noEl?(S.acc?t("warnNoElev"):""):x.elevNote?t("elevAt",{w:x.elevNote}):"",note2:!noEl&&x.elevNote?tr:""})}
  if(di.howto)st.push({kind:"inside",text:di.howto,note:tr});
  st.push({kind:"dept",text:t("deptArrive",{d:nm(dept)})});
  return st;
}

const FULL=[100,40,1520,1290];
function viewBox(R){
  if(!R||S.whole)return FULL;
  const P=R.path.map(id=>N[id]);let x0=Math.min(...P.map(p=>p.x)),x1=Math.max(...P.map(p=>p.x)),y0=Math.min(...P.map(p=>p.y)),y1=Math.max(...P.map(p=>p.y));
  // extra room on top for the destination tag
  const pad=110;x0-=pad;x1+=pad;y0-=pad+170;y1+=pad;let w=Math.max(x1-x0,560),h=Math.max(y1-y0,470);const ar=FULL[2]/FULL[3];
  if(w/h>ar)h=w/ar;else w=h*ar;const cx=(x0+x1)/2,cy=(y0+y1)/2;return [cx-w/2,cy-h/2,w,h];
}
function mapSVG(R,active){

  // map units per screen pixel, so labels and markers keep a readable size at any zoom

/* ---------- Live navigation (GPS or walking simulation) ---------- */
const SIM_SPEED=9; // metres per second, sped up for demos
function liveBox(p){const w=560,h=w*FULL[3]/FULL[2];return [p.x-w/2,p.y-h/2,w,h]}
function pointAt(R,m){const P=R.path.map(id=>N[id]);for(let i=0;i<R.edges.length;i++){if(m<=R.cum[i+1]||i===R.edges.length-1){const e=R.cum[i+1]-R.cum[i]||1,f=Math.min(1,Math.max(0,(m-R.cum[i])/e));return {x:P[i].x+(P[i+1].x-P[i].x)*f,y:P[i].y+(P[i+1].y-P[i].y)*f}}}return {x:P[0].x,y:P[0].y}}
function project(R,p){const P=R.path.map(id=>N[id]);let best={d:Infinity,m:0};
  for(let i=0;i<R.edges.length;i++){const a=P[i],b=P[i+1],dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;const f=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/L2));
    const qx=a.x+dx*f,qy=a.y+dy*f,d=Math.hypot(p.x-qx,p.y-qy)*0.5;if(d<best.d)best={d,m:R.cum[i]+(R.cum[i+1]-R.cum[i])*f}}return best}
function liveStep(steps,m){const last=steps.findIndex(s=>s.kind==="arrive");for(let i=1;i<last;i++)if(steps[i].endM>m+1)return i;return last}
// GPS calibration: two known points (the gates) give a similarity transform from GPS to map units
const CAL_PTS={g1:[1238,385],g2:[900,1232]};
function loadCal(){try{return JSON.parse(localStorage.getItem("barzigo-cal")||"{}")}catch(e){return {}}}
function saveCal(c){try{localStorage.setItem("barzigo-cal",JSON.stringify(c))}catch(e){}}
function gpsToMap(lat,lng){const c=loadCal();if(!c.g1||!c.g2)return null;
  const loc=(la,ln)=>[(ln-c.g1.lng)*Math.cos(c.g1.lat*Math.PI/180)*111320,(la-c.g1.lat)*110540];
  const w1=[0,0],w2=loc(c.g2.lat,c.g2.lng),z1=[CAL_PTS.g1[0],-CAL_PTS.g1[1]],z2=[CAL_PTS.g2[0],-CAL_PTS.g2[1]];
  const dw=[w2[0]-w1[0],w2[1]-w1[1]],dz=[z2[0]-z1[0],z2[1]-z1[1]],den=dw[0]*dw[0]+dw[1]*dw[1];if(!den)return null;
  const a=[(dz[0]*dw[0]+dz[1]*dw[1])/den,(dz[1]*dw[0]-dz[0]*dw[1])/den],w=loc(lat,lng);
  const z=[a[0]*w[0]-a[1]*w[1]+z1[0],a[0]*w[1]+a[1]*w[0]+z1[1]];return {x:z[0],y:-z[1],scale:Math.hypot(a[0],a[1])}}
function calOk(){const c=loadCal();if(!c.g1||!c.g2)return false;const p=gpsToMap(c.g1.lat,c.g1.lng);return p&&p.scale>0.8&&p.scale<6}
let LR=null,LS=null; // route and steps of the running live session
function liveStart(mode){
  liveStop();S.view="live";S.whole=false;S.live={mode,m:0,step:1,pos:null,paused:false,msg:"",acc:null,off:0};
  LR=findRoute(S.from,"B"+D[S.to].b);LS=buildSteps(LR,D[S.to]);
  if(mode==="sim"){S.live.pos=pointAt(LR,0);let last=performance.now();
    const tick=now=>{if(!S.live||S.live.mode!=="sim")return;const dt=Math.min(.1,(now-last)/1000);last=now;
      if(!S.live.paused){S.live.m+=dt*SIM_SPEED;S.live.pos=pointAt(LR,S.live.m);liveUpdate()}if(S.live)S.live.raf=requestAnimationFrame(tick)};
    S.live.raf=requestAnimationFrame(tick)}

}
function gpsStart(){
  if(!navigator.geolocation){S.live.msg=t("gpsNo");return}
  S.live.msg=t("gpsWait");
  try{S.live.watch=navigator.geolocation.watchPosition(onFix,()=>{if(S.live){S.live.msg=t("gpsNo");S.live.denied=true;render()}},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}
  catch(e){S.live.msg=t("gpsNo");S.live.denied=true}
}
function onFix(pos){
  if(!S.live)return;const {latitude:lat,longitude:lng,accuracy}=pos.coords;S.live.lastFix={lat,lng};S.live.acc=Math.round(accuracy);
  const p=gpsToMap(lat,lng);if(!p||!calOk()){S.live.msg="";render();return}
  const pr=project(LR,p);S.live.pos=p;S.live.msg="";
  if(pr.d>30){S.live.off++;if(S.live.off>=3){// reroute from the nearest walkable point
      let best=null,bd=Infinity;for(const id in N){const n=N[id];if(n.bld)continue;const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<bd){bd=d;best=id}}
      S.from=best;LR=findRoute(S.from,"B"+D[S.to].b);LS=buildSteps(LR,D[S.to]);S.live.m=0;S.live.off=0;S.live.step=1;S.live.msg=t("offRoute");render();return}}
  else{S.live.off=0;S.live.m=Math.max(S.live.m,pr.m)}

function liveStop(){if(!S.live)return;if(S.live.raf)cancelAnimationFrame(S.live.raf);if(S.live.watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(S.live.watch);S.live=null}
function liveUpdate(){
  const L=S.live;if(!L||!LR)return;
  if(L.m>=LR.total-1){liveStop();S.view="arrived";S.fb=null;render();return}
  const k=liveStep(LS,L.m);if(k!==L.step){L.step=k;render();return}
  const dot=document.getElementById("liveDot"),svg=document.getElementById("mapSvg");
  if(dot&&L.pos){dot.setAttribute("transform",`translate(${L.pos.x.toFixed(1)} ${L.pos.y.toFixed(1)})`);dot.removeAttribute("opacity")}
  if(svg&&L.pos&&!S.whole)svg.setAttribute("viewBox",liveBox(L.pos).map(v=>v.toFixed(0)).join(" "));
  const a=document.getElementById("liveIn"),b=document.getElementById("liveTot");
  if(a)a.textContent=t("inM",{d:Math.max(0,Math.round(LS[k].endM-L.m))});
  if(b){const left=Math.max(0,LR.total-L.m);b.textContent=t("remain",{d:Math.round(left),t:Math.max(1,Math.round(left/1.2/60))})}

function livePanel(){

    <div class="big"><span class="ic">${ico(s.kind)}</span><div class="say" aria-live="polite">${esc(s.text)}</div>
      ${s.kind!=="arrive"?`<div class="sum"><span class="pill" id="liveIn">${esc(t("inM",{d:Math.max(0,Math.round(s.endM-L.m))}))}</span><span class="pill" id="liveTot">${esc(t("remain",{d:Math.round(left),t:Math.max(1,Math.round(left/1.2/60))}))}</span></div>`:""}
      ${nx?`<div class="note" style="font-size:.95rem">${esc(t("then",{s:nx.text}))}</div>`:""}</div>
    ${voiceBtn()}
    ${L.mode==="sim"?`<p class="note" style="margin:0">${esc(t("liveSimNote"))}</p><button class="btn soft" data-act="livePause">${esc(L.paused?t("resume"):t("pause"))}</button>`:""}
    ${L.mode==="gps"&&L.msg?`<div class="gpsmsg">${esc(L.msg)}</div>`:""}
    ${L.mode==="gps"&&L.acc!=null?`<p class="note" style="margin:0">${esc(t("gpsAcc",{a:L.acc}))}</p>`:""}
    ${L.mode==="gps"&&L.denied?`<button class="btn soft" data-act="liveSim">${ico("walk",20)}${esc(t("liveSim"))}</button>`:""}</div>
  ${needCal?`<div class="card"><h3>${esc(t("calT"))}</h3><p class="note" style="margin:0">${esc(t("calD"))}</p>
    <div class="livebtns"><button class="btn ${c.g1?"soft":"ghost"}" data-act="cal" data-id="g1">${esc(t("calG1"))}${c.g1?" · "+esc(t("calSaved")):""}</button><button class="btn ${c.g2?"soft":"ghost"}" data-act="cal" data-id="g2">${esc(t("calG2"))}${c.g2?" · "+esc(t("calSaved")):""}</button></div>
    ${c.g1&&c.g2&&!calOk()?`<div class="gpsmsg">${esc(t("calBad"))}</div>`:""}</div>`:""}`;
}

/* ---------- Render ---------- */
function render(){
  document.documentElement.classList.toggle("big",S.big);
  const rtl=S.lang==="he"||S.lang==="ar";app.dir=rtl?"rtl":"ltr";app.lang=S.lang;document.documentElement.lang=S.lang;
  let R=null,steps=null,active=null,panel;
  if(S.to&&S.view!=="home"&&S.view!=="live"){R=findRoute(S.from,"B"+D[S.to].b);if(R){steps=buildSteps(R,D[S.to]);if(S.step>=steps.length)S.step=steps.length-1}}
  if(S.view==="route"&&R){panel=routePanel(R,steps);active=S.sel!=null?steps[S.sel]:null}
  else if(S.view==="steps"&&R){panel=stepsPanel(R,steps);active=steps[S.step]}
  else if(S.view==="live"&&S.live&&LR){R=LR;steps=LS;panel=livePanel();active=steps[S.live.step]}
  else if(S.view==="arrived"){panel=arrivedPanel()}
  else{S.view="home";panel=homePanel()}
  app.innerHTML=header()+`<main class="grid v-${S.view==="live"?"steps":S.view}"><section class="panel">${panel}</section><section class="mapcol">${mapCol(S.view==="home"?null:R,active)}</section></main><p class="foot">${esc(t("foot"))}</p>`;
  // read the current instruction aloud once each time it changes
  if(S.voice&&steps&&(S.view==="steps"||S.view==="live")){const i=S.view==="steps"?S.step:S.live.step,s=steps[i],key=S.view+S.to+i;
    if(key!==S.spoken){S.spoken=key;say(s.text+(s.note?". "+s.note:""))}}
}
function goTo(id){S.to=id;S.view="route";S.step=0;S.sel=null;S.fb=null;S.whole=false;render();window.scrollTo({top:0})}
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case"big":S.big=!S.big;save();break;
    case"acc":S.acc=!S.acc;save();break;
    case"voice":S.voice=!S.voice;S.spoken=null;if(!S.voice&&window.speechSynthesis)speechSynthesis.cancel();save();break;
    case"scan":S.scan=!S.scan;break;
    case"station":S.from=id;S.scan=false;break;
    case"cat":S.cat=id;S.q="";break;
    case"go":goTo(id);return;
    case"bld":{S.q=id;S.cat="all";S.view="home";S.to=null;render();const q=document.getElementById("q");if(q)q.scrollIntoView({block:"center"});return}
    case"sms":S.from="P1";goTo(byName("300","מרפאת"));return;
    case"back":case"newDest":liveStop();S.view="home";S.to=null;S.sel=null;break;
    case"startSteps":S.view="steps";S.step=0;break;
    case"allSteps":S.view="route";S.sel=S.step;break;
    case"sel":{const i=+el.dataset.i;S.sel=S.sel===i?null:i;break}
    case"next":S.step++;break;
    case"prev":S.step=Math.max(0,S.step-1);break;
    case"arrived":S.view="arrived";break;
    case"fb":S.fb=id;break;
    case"whole":S.whole=!S.whole;break;
    case"liveSim":liveStart("sim");return;
    case"liveGps":liveStart("gps");return;
    case"livePause":S.live.paused=!S.live.paused;break;
    case"liveStop":liveStop();S.view="route";break;
    case"cal":{const f=S.live&&S.live.lastFix;if(!f){S.live.msg=t("gpsWait");break}const c=loadCal();c[id]=f;saveCal(c);break}
    default:return;
  }
  render();
});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches("g.bl")){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("change",ev=>{if(ev.target.id==="lang"){S.lang=ev.target.value;save();render()}});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){S.q=ev.target.value;if(S.q)S.cat="all";document.getElementById("destWrap").innerHTML=destList();
  document.querySelectorAll(".cat").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===S.cat)))}});
function fromHash(){const h=(location.hash||"").slice(1);
  if(h.startsWith("qr-")&&HASH[h.slice(3)]){S.from=HASH[h.slice(3)];S.view="home";S.to=null}
  else if(h==="sms-eye"){S.from="P1";S.to=byName("300","מרפאת");S.view="route"}}
window.addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();loadField();
</script>
